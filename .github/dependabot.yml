version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: disabled
    # Allow updates for all direct and indirect dependencies.
    allow:
      - dependency-type: "all"
    # Keep clang-format, clang-tidy, and clangd on major version 20.
    ignore:
      - dependency-name: "clang-format"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clang-tidy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clangd"
        update-types: ["version-update:semver-major"]
    groups:
      # Group Clang tools and clangd-tidy version updates into a single pull request.
      clang-tools:
        applies-to: "version-updates"
        patterns:
          - "clang-format"
          - "clang-tidy"
          - "clangd"
          - "clangd-tidy"
      # These tools depend on one another; review their updates together.
      online-judge:
        applies-to: version-updates
        patterns:
          - "online-judge-api-client"
          - "online-judge-template-generator"
          - "online-judge-tools"
          - "online-judge-verify-helper"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      # Group official GitHub Actions updates into a single pull request.
      actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
