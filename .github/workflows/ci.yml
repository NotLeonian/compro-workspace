name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Ruff format
        run: uv run --locked ruff format --check . .vscode/bundle.py
      - name: Ruff lint
        run: uv run --locked ruff check . .vscode/bundle.py
      - name: Pyright
        run: uv run --locked pyright . .vscode/bundle.py
      - name: Mypy
        run: uv run --no-sync mypy . .vscode/bundle.py
      - name: Bundle tests
        run: uv run --locked python -m unittest discover -s tests -v
